<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070f">
<meta name="description" content="Неон-Раннер — бесконечный раннер. Тапни, чтобы прыгнуть.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Неон-Раннер</title>
<style>
  :root{
    --cyan:#22d3ee; --violet:#a855f7; --rose:#fb3b6b; --gold:#fbbf24;
    --fg:#e8f4ff; --dim:#7c8bb0;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#07070f}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--fg);
    touch-action:none;
    overscroll-behavior:none;
    user-select:none;-webkit-user-select:none;
  }
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}

  .hud{
    position:fixed;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + 16px) 0 calc(env(safe-area-inset-left,0px) + 16px);
    pointer-events:none;font-variant-numeric:tabular-nums;
  }
  .hud .lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
  .hud .val{font-size:clamp(20px,5.5vw,32px);font-weight:800;line-height:1;text-shadow:0 0 14px rgba(34,211,238,.55)}
  .hud .right{text-align:right}
  .hud .right .val{color:var(--gold);text-shadow:0 0 14px rgba(251,191,36,.5)}
  .badge{
    display:inline-block;margin-top:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim);opacity:.75;
  }
  .badge.on{color:var(--gold);opacity:1}

  .screen{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;text-align:center;
    padding:24px calc(env(safe-area-inset-right,0px) + 22px) calc(env(safe-area-inset-bottom,0px) + 24px) calc(env(safe-area-inset-left,0px) + 22px);
    background:radial-gradient(120% 90% at 50% 40%,rgba(10,10,28,.85),rgba(4,4,10,.96));
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    transition:opacity .22s ease;
    z-index:5;
  }
  .screen.hide{opacity:0;pointer-events:none}
  .title{
    font-size:clamp(34px,11vw,74px);font-weight:900;letter-spacing:.02em;line-height:.95;
    color:#fff;
    text-shadow:0 0 12px var(--cyan),0 0 34px rgba(34,211,238,.75),0 0 66px rgba(168,85,247,.6);
  }
  .title small{display:block;font-size:.34em;font-weight:700;letter-spacing:.42em;color:var(--violet);text-shadow:0 0 18px rgba(168,85,247,.8);margin-bottom:.5em;text-transform:uppercase}
  .sub{font-size:clamp(13px,3.6vw,16px);color:var(--dim);max-width:34ch;line-height:1.55}
  .sub b{color:var(--fg);font-weight:700}
  .btn{
    appearance:none;border:0;cursor:pointer;
    font:inherit;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    font-size:clamp(13px,3.8vw,16px);
    padding:16px 40px;border-radius:999px;color:#04121a;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    box-shadow:0 0 0 1px rgba(255,255,255,.14),0 10px 34px rgba(34,211,238,.35),0 0 46px rgba(168,85,247,.3);
    transition:transform .12s ease,filter .12s ease;
  }
  .btn:active{transform:scale(.955);filter:brightness(1.14)}
  .scores{display:flex;gap:26px;align-items:baseline}
  .scores .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
  .scores .v{font-size:clamp(28px,9vw,50px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .scores .v.cy{color:var(--cyan);text-shadow:0 0 20px rgba(34,211,238,.6)}
  .scores .v.go{color:var(--gold);text-shadow:0 0 20px rgba(251,191,36,.6)}
  .rec{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--gold);
    text-shadow:0 0 16px rgba(251,191,36,.7);
    height:14px;opacity:0;transition:opacity .3s ease;
  }
  .rec.on{opacity:1}
  .keys{font-size:11px;color:var(--dim);letter-spacing:.06em;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .keys kbd{
    font:inherit;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;
    border:1px solid rgba(124,139,176,.4);color:var(--dim);background:rgba(124,139,176,.08);
  }
  .hidden{display:none!important}
  @media (max-height:430px){
    .screen{gap:10px}
    .title{font-size:clamp(26px,7vw,40px)}
    .sub{font-size:12px;max-width:46ch}
    .btn{padding:12px 30px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div>
    <div class="lbl">Очки</div>
    <div class="val" id="score">0</div>
  </div>
  <div class="right">
    <div class="lbl">Рекорд</div>
    <div class="val" id="best">0</div>
    <div class="badge" id="speedBadge">x1.0</div>
  </div>
</div>

<div class="screen" id="start">
  <div class="title"><small>Неон</small>Раннер</div>
  <p class="sub">Одна кнопка. Прыгай через препятствия, собирай монетки. <b>Скорость растёт</b> — держись дольше.</p>
  <button class="btn" id="playBtn">Играть</button>
  <div class="keys">
    <span><kbd>Тап</kbd> или <kbd>Клик</kbd></span>
    <span><kbd>Пробел</kbd> / <kbd>↑</kbd></span>
  </div>
</div>

<div class="screen hide" id="over">
  <div class="title" style="font-size:clamp(28px,9vw,58px)">Игра<br>окончена</div>
  <div class="rec" id="newRec">Новый рекорд!</div>
  <div class="scores">
    <div><div class="k">Очки</div><div class="v cy" id="overScore">0</div></div>
    <div><div class="k">Рекорд</div><div class="v go" id="overBest">0</div></div>
  </div>
  <button class="btn" id="againBtn">Ещё раз</button>
  <div class="keys"><span><kbd>Тап</kbd> / <kbd>Пробел</kbd> — заново</span></div>
</div>

<script>
(function(){
'use strict';

var cv = document.getElementById('c');
var ctx = cv.getContext('2d', {alpha:false});
var elScore = document.getElementById('score');
var elBest = document.getElementById('best');
var elBadge = document.getElementById('speedBadge');
var startScr = document.getElementById('start');
var overScr = document.getElementById('over');
var elOverScore = document.getElementById('overScore');
var elOverBest = document.getElementById('overBest');
var elNewRec = document.getElementById('newRec');

var CI='#22d3ee', VI='#a855f7', RO='#fb3b6b', GO='#fbbf24';

var MENU=0, PLAY=1, OVER=2;
var state = MENU;

var W=0, H=0, DPR=1;
var groundY=0, psize=30, baseSpeed=520, px=70;

var player, obstacles, coins, particles, stars, trail;
var speed, elapsed, score, distance, coinScore, nextObs, nextCoin, spawnGap;
var shake, tGlobal = 0;
var best = 0;
var lastShown = -1;

try { best = parseInt(localStorage.getItem('neonRunnerBest') || '0', 10) || 0; } catch(e){ best = 0; }
elBest.textContent = best;

function rand(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function metrics(){
  groundY = Math.round(H * (W > H ? 0.84 : 0.80));
  psize = clamp(Math.min(W,H) * 0.075, 20, 44);
  px = Math.round(clamp(W * 0.17, 52, 150));
  baseSpeed = clamp(W * 0.55, 300, 900);
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth || window.innerWidth;
  H = cv.clientHeight || window.innerHeight;
  cv.width = Math.max(1, Math.round(W * DPR));
  cv.height = Math.max(1, Math.round(H * DPR));
  ctx.setTransform(DPR,0,0,DPR,0,0);
  metrics();
  buildStars();
  if (player) player.y = groundY - psize;
}

function buildStars(){
  stars = [];
  var n = Math.round((W*H) / 24000);
  n = clamp(n, 26, 110);
  for (var i=0;i<n;i++){
    stars.push({
      x: Math.random()*W,
      y: Math.random()*(groundY-10),
      r: rand(0.6,1.9),
      a: rand(0.18,0.75),
      z: rand(0.15,0.75)
    });
  }
}

function reset(){
  metrics();
  player = { y: groundY - psize, vy: 0, onGround: true, jumps: 0, rot: 0, squash: 0 };
  obstacles = [];
  coins = [];
  particles = [];
  trail = [];
  speed = baseSpeed;
  elapsed = 0;
  distance = 0;
  coinScore = 0;
  score = 0;
  nextObs = W * 0.85;
  nextCoin = W * 1.3;
  spawnGap = 0;
  shake = 0;
  lastShown = -1;
  elScore.textContent = '0';
  elBadge.textContent = 'x1.0';
  elBadge.classList.remove('on');
}

function jump(){
  if (state !== PLAY) return;
  if (player.onGround){
    var g = H * 3.35;
    player.vy = -Math.sqrt(2 * g * (H * 0.215));
    player.onGround = false;
    player.squash = -0.32;
    puff(px + psize*0.5, groundY, 7, CI);
  }
}

function puff(x,y,n,col){
  for (var i=0;i<n;i++){
    particles.push({
      x:x + rand(-6,6), y:y + rand(-4,4),
      vx: rand(-90,90) - (state===PLAY ? speed*0.18 : 0),
      vy: rand(-140,20),
      life: rand(0.28,0.6), t:0,
      r: rand(1.4,3.6), col: col
    });
  }
}

function burst(x,y,n,col){
  for (var i=0;i<n;i++){
    var a = Math.random()*Math.PI*2, sp = rand(70,320);
    particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 70,
      life: rand(0.4,0.95), t:0, r: rand(1.6,4.2), col: col });
  }
}

function spawnObstacle(){
  var hMax = H * 0.135;
  var h = clamp(psize * rand(0.95, 1.5), psize*0.9, hMax);
  var w = clamp(psize * rand(0.55, 0.95), 13, 60);
  obstacles.push({ x: W + w, y: groundY - h, w: w, h: h, kind: Math.random() < 0.35 ? 1 : 0 });
}

function spawnCoins(){
  var n = Math.round(rand(3,6));
  var y = groundY - clamp(rand(psize*1.6, Math.min(H*0.17, psize*3.6)), psize*1.5, H*0.18);
  var gap = psize * 0.95;
  for (var i=0;i<n;i++){
    coins.push({ x: W + 30 + i*gap, y: y, got: false, ph: rand(0,6.28) });
  }
}

/* ---------------- update ---------------- */
function update(dt){
  tGlobal += dt;

  // particles & trail always animate
  for (var i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.t += dt;
    if (p.t >= p.life){ particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += 420*dt;
    p.vx *= 0.985;
  }
  for (i=trail.length-1;i>=0;i--){
    trail[i].t += dt;
    if (trail[i].t > 0.35) trail.splice(i,1);
  }

  // stars drift
  var sc = (state === PLAY ? speed : baseSpeed*0.25);
  for (i=0;i<stars.length;i++){
    var s = stars[i];
    s.x -= sc * s.z * 0.055 * dt * 10 * 0.1;
    s.x -= sc * s.z * dt * 0.10;
    if (s.x < -4){ s.x = W + rand(0,60); s.y = Math.random()*(groundY-10); }
  }

  if (state !== PLAY){
    if (shake > 0) shake = Math.max(0, shake - dt*3.2);
    return;
  }

  elapsed += dt;
  var ramp = clamp(1 + elapsed/42, 1, 2.6);
  speed = baseSpeed * ramp;

  var disp = speed * dt;
  distance += disp;
  score = Math.floor(distance/26) + coinScore;

  // speed badge
  var r1 = Math.round(ramp*10)/10;
  if (r1 >= 1.5) elBadge.classList.add('on');
  if (score !== lastShown){
    lastShown = score;
    elScore.textContent = score;
  }
  elBadge.textContent = 'x' + ramp.toFixed(1);

  // player physics
  var g = H * 3.35;
  if (!player.onGround){
    player.vy += g*dt;
    player.y += player.vy*dt;
    if (player.y >= groundY - psize){
      player.y = groundY - psize;
      player.vy = 0;
      player.onGround = true;
      player.squash = 0.34;
      puff(px, groundY, 5, VI);
    }
  }
  player.squash += (0 - player.squash) * Math.min(1, dt*14);
  player.rot = player.onGround ? 0 : clamp(player.vy / (H*2.2), -0.28, 0.28);

  // trail
  trail.push({ x: px + psize*0.5, y: player.y + psize*0.5, t:0 });
  if (trail.length > 26) trail.shift();

  // spawning
  nextObs -= disp;
  if (nextObs <= 0){
    spawnObstacle();
    spawnGap = speed * rand(0.80, 1.55);
    nextObs = spawnGap + rand(0, speed*0.25);
  }
  nextCoin -= disp;
  if (nextCoin <= 0){
    spawnCoins();
    nextCoin = speed * rand(1.6, 3.2);
  }

  // move obstacles
  for (i=obstacles.length-1;i>=0;i--){
    var o = obstacles[i];
    o.x -= disp;
    if (o.x + o.w < -20){ obstacles.splice(i,1); continue; }
    if (hit(player, o)) return die(o);
  }

  // coins
  var pcx = px + psize*0.5, pcy = player.y + psize*0.5;
  for (i=coins.length-1;i>=0;i--){
    var cn = coins[i];
    cn.x -= disp;
    cn.ph += dt*4;
    if (cn.x < -40){ coins.splice(i,1); continue; }
    var dx = cn.x - pcx, dy = cn.y - pcy;
    if (dx*dx + dy*dy < Math.pow(psize*0.72, 2)){
      coins.splice(i,1);
      coinScore += 10;
      burst(cn.x, cn.y, 12, GO);
    }
  }

  if (shake > 0) shake = Math.max(0, shake - dt*3.2);
}

function hit(p, o){
  var m = psize*0.17;
  var pl = px + m, pr = px + psize - m, pt = p.y + m, pb = p.y + psize - m*0.6;
  var ol = o.x + o.w*0.14, or_ = o.x + o.w*0.86, ot = o.y + o.h*0.06, ob = o.y + o.h;
  return pl < or_ && pr > ol && pt < ob && pb > ot;
}

function die(o){
  state = OVER;
  shake = 1;
  burst(px + psize*0.5, player.y + psize*0.5, 34, RO);
  burst(o.x + o.w*0.5, o.y + o.h*0.5, 16, VI);
  try { if (navigator.vibrate) navigator.vibrate(70); } catch(e){}

  var isRec = score > best;
  if (isRec){
    best = score;
    try { localStorage.setItem('neonRunnerBest', String(best)); } catch(e){}
  }
  elBest.textContent = best;
  elOverScore.textContent = score;
  elOverBest.textContent = best;
  elNewRec.classList.toggle('on', isRec);
  overScr.classList.remove('hide');
}

/* ---------------- draw ---------------- */
function draw(){
  var sx = 0, sy = 0;
  if (shake > 0){
    sx = rand(-1,1) * shake * 9;
    sy = rand(-1,1) * shake * 9;
  }
  ctx.save();
  ctx.translate(sx, sy);

  // background
  var bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0, '#07070f');
  bg.addColorStop(0.55, '#0c0b1d');
  bg.addColorStop(1, '#16102e');
  ctx.fillStyle = bg;
  ctx.fillRect(-20, -20, W+40, H+40);

  // horizon glow
  var hg = ctx.createRadialGradient(W*0.5, groundY, 0, W*0.5, groundY, Math.max(W,H)*0.75);
  hg.addColorStop(0, 'rgba(34,211,238,0.16)');
  hg.addColorStop(0.45, 'rgba(168,85,247,0.09)');
  hg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0,0,W,H);

  // stars
  for (var i=0;i<stars.length;i++){
    var s = stars[i];
    ctx.globalAlpha = s.a * (0.65 + 0.35*Math.sin(tGlobal*2 + s.x*0.05));
    ctx.fillStyle = s.z > 0.55 ? CI : '#cbd5ff';
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  // perspective grid on the ground plane
  var scroll = (distance || 0) % 120;
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(34,211,238,0.16)';
  ctx.beginPath();
  for (var k=0;k<14;k++){
    var yy = groundY + Math.pow(k/13, 1.7) * (H-groundY) + 1;
    if (yy > H+2) break;
    ctx.moveTo(0, yy); ctx.lineTo(W, yy);
  }
  ctx.stroke();

  ctx.strokeStyle = 'rgba(168,85,247,0.13)';
  ctx.beginPath();
  for (var vx = -W; vx < W*2; vx += 130){
    var x0 = vx - scroll;
    ctx.moveTo(x0, groundY);
    ctx.lineTo(W*0.5 + (x0 - W*0.5)*2.6, H);
  }
  ctx.stroke();

  // ground line
  ctx.save();
  ctx.shadowColor = CI; ctx.shadowBlur = 18;
  ctx.strokeStyle = CI; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
  ctx.restore();

  // trail
  for (i=0;i<trail.length;i++){
    var t = trail[i], a = (1 - t.t/0.35) * 0.30;
    ctx.globalAlpha = a;
    ctx.fillStyle = VI;
    var sz = psize * (0.35 + 0.4*(i/trail.length));
    ctx.fillRect(t.x - sz/2, t.y - sz/2, sz, sz);
  }
  ctx.globalAlpha = 1;

  // coins
  for (i=0;i<coins.length;i++){
    var cn = coins[i];
    var rr = psize * (0.20 + 0.035*Math.sin(cn.ph));
    ctx.save();
    ctx.shadowColor = GO; ctx.shadowBlur = 14;
    ctx.fillStyle = GO;
    ctx.beginPath();
    ctx.ellipse(cn.x, cn.y, Math.abs(Math.cos(cn.ph*0.8))*rr + rr*0.25, rr, 0, 0, 6.284);
    ctx.fill();
    ctx.restore();
  }

  // obstacles
  for (i=0;i<obstacles.length;i++){
    var o = obstacles[i];
    ctx.save();
    ctx.shadowColor = RO; ctx.shadowBlur = 16;
    var og = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
    og.addColorStop(0, '#ff6b8f');
    og.addColorStop(1, '#c81e5a');
    ctx.fillStyle = og;
    roundRect(o.x, o.y, o.w, o.h, Math.min(6, o.w*0.28));
    ctx.fill();
    ctx.restore();
    if (o.kind === 1){
      ctx.fillStyle = 'rgba(255,255,255,0.30)';
      ctx.fillRect(o.x + o.w*0.22, o.y + o.h*0.22, o.w*0.56, Math.max(2, o.h*0.10));
    }
  }

  // player
  var sq = player.squash;
  var pw = psize * (1 - sq*0.55);
  var ph = psize * (1 + sq*0.85);
  var pxx = px + (psize - pw)/2;
  var pyy = groundY - ph;
  if (!player.onGround) pyy = player.y + (psize - ph)/2;

  ctx.save();
  ctx.translate(pxx + pw/2, pyy + ph/2);
  ctx.rotate(player.rot);
  ctx.translate(-pw/2, -ph/2);
  ctx.shadowColor = CI; ctx.shadowBlur = 22;
  var pg = ctx.createLinearGradient(0,0,pw,ph);
  pg.addColorStop(0, '#67e8f9');
  pg.addColorStop(1, VI);
  ctx.fillStyle = pg;
  roundRect(0, 0, pw, ph, pw*0.3);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  var eh = Math.max(2, ph*0.10);
  ctx.fillRect(pw*0.58, ph*0.24, pw*0.26, eh);
  ctx.fillRect(pw*0.58, ph*0.52, pw*0.26, eh);
  ctx.restore();

  // particles
  for (i=0;i<particles.length;i++){
    var p = particles[i];
    var al = 1 - p.t/p.life;
    ctx.globalAlpha = al*0.92;
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r*al + 0.5, 0, 6.284);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // vignette
  var vg = ctx.createRadialGradient(W*0.5, H*0.5, Math.min(W,H)*0.30, W*0.5, H*0.5, Math.max(W,H)*0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  ctx.restore();
}

function roundRect(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

/* ---------------- loop ---------------- */
var last = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if (!last) last = ts;
  var dt = (ts - last) / 1000;
  last = ts;
  if (dt > 0.05) dt = 0.05;
  if (document.hidden) return;
  update(dt);
  draw();
}

/* ---------------- control ---------------- */
function begin(){
  if (state === PLAY) return;
  reset();
  state = PLAY;
  startScr.classList.add('hide');
  overScr.classList.add('hide');
}

function onTap(e){
  if (state === PLAY){ jump(); }
  else { begin(); }
}

cv.addEventListener('pointerdown', function(e){ e.preventDefault(); onTap(e); }, {passive:false});
cv.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});
cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

document.getElementById('playBtn').addEventListener('click', function(e){ e.stopPropagation(); begin(); });
document.getElementById('againBtn').addEventListener('click', function(e){ e.stopPropagation(); begin(); });

window.addEventListener('keydown', function(e){
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter' || e.key === ' '){
    e.preventDefault();
    if (state === PLAY) jump(); else begin();
  }
}, {passive:false});

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 180); });
document.addEventListener('visibilitychange', function(){ last = 0; });

resize();
reset();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
